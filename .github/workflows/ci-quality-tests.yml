name: CI Quality Tests

on:
  push:
    branches: [Sprint1, develop, main]
  pull_request:
    branches: [Sprint1, develop, main]

jobs:
  build-and-test:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'

      - name: Restore
        run: dotnet restore AutoStock.sln

      - name: Build (Release + análisis estático)
        run: dotnet build AutoStock.sln --configuration Release --no-restore

      - name: Test
        run: dotnet test AutoStock.sln --configuration Release --no-build --verbosity normal
